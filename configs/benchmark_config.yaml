model:
  name: yolov8n
  input_size: 640
  # Deployment thresholds — used for latency benchmarking and real inference
  conf_threshold: 0.5
  iou_threshold: 0.45
  # Evaluation thresholds — used for mAP measurement only.
  # COCOeval sweeps thresholds internally; submitting all detections above 0.001
  # exposes the full precision-recall curve. Using 0.5 here permanently truncates
  # the PR curve, suppressing mAP by ~29% (Run 1 finding, Issue 1).
  eval_conf_threshold: 0.001
  # ultralytics val.py uses iou=0.7 for NMS during validation to preserve more
  # candidate boxes for COCOeval. Using 0.45 (deployment NMS) aggressively
  # suppresses valid detections at the high box-density produced by conf=0.001.
  eval_iou_threshold: 0.7

benchmark:
  n_runs: 100
  n_warmup: 10
  batch_size: 1

calibration:
  n_images: 500
  seed: 42

data:
  coco_val_dir: ./data/val2017
  annotations_file: ./data/annotations/instances_val2017.json
  calibration_dir: ./data/calibration

output:
  results_dir: ./results
  format:
    - json
    - csv

runtimes:
  pytorch:
    devices:
      - cpu
      - mps        # Mac M4 only
    precisions:
      - fp32
      - fp16       # MPS only
  onnx:
    execution_providers:
      - CoreMLExecutionProvider    # Mac M4 Neural Engine
      - CPUExecutionProvider       # Fallback
    precisions:
      - fp32
      - fp16
      - int8
  tensorrt:
    precisions:
      - fp32
      - fp16
      - int8
